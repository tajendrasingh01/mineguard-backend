name: MineGuard safety-management checks
# Validates syntax and manifest after each branch/PR update
on:
  pull_request:
  push:
    branches: [feat/secl-safety-management-refactor]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check server.js
      - run: node --check seed-secl-areas.js
      - run: node --check safety-policy.js
      - run: npm test
